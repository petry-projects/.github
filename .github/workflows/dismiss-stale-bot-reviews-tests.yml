# Quality gate for the dismiss-stale-bot-reviews decision core (#1115).
#
# Triggered on any PR that touches:
#   - scripts/dismiss-stale-bot-reviews.sh            (orchestrator glue)
#   - scripts/lib/dismiss-stale-bot-reviews.sh        (pure decision core)
#   - test/workflows/dismiss-stale-bot-reviews/**     (the tests themselves)
#   - .github/workflows/dismiss-stale-bot-reviews*.yml
#   - standards/workflows/dismiss-stale-bot-reviews.yml
#
# Gate: bats — the decision matrix (dismiss an allow-listed bot's
#       CHANGES_REQUESTED on a superseded commit; keep it on the current head;
#       never touch human or non-allow-listed reviews).

name: Dismiss Stale Bot Reviews Tests

on:
  pull_request:
    paths:
      - 'scripts/dismiss-stale-bot-reviews.sh'
      - 'scripts/lib/dismiss-stale-bot-reviews.sh'
      - 'test/workflows/dismiss-stale-bot-reviews/**'
      - '.github/workflows/dismiss-stale-bot-reviews*.yml'
      - 'standards/workflows/dismiss-stale-bot-reviews.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/dismiss-stale-bot-reviews.sh'
      - 'scripts/lib/dismiss-stale-bot-reviews.sh'
      - 'test/workflows/dismiss-stale-bot-reviews/**'
      - '.github/workflows/dismiss-stale-bot-reviews*.yml'
      - 'standards/workflows/dismiss-stale-bot-reviews.yml'

permissions:
  contents: read

concurrency:
  group: dismiss-stale-bot-reviews-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install bats
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats

      - name: Run bats suite
        run: bats --print-output-on-failure test/workflows/dismiss-stale-bot-reviews/
